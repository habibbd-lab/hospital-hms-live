<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বেড ও ওয়ার্ড ব্যবস্থাপনা (Bed Matrix) | CarePoint HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div id="demo-banner-placeholder"></div>

  <div class="dashboard-wrapper">
    <aside class="hms-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="hms-main-content">
      <header id="admin-topbar-placeholder"></header>

      <div class="dashboard-content">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
          <div>
            <h4 class="fw-bold text-hms-navy mb-1">শয্যা ও ওয়ার্ড ব্যবস্থাপনা (Bed & Ward Matrix)</h4>
            <p class="text-muted small mb-0">ওয়ার্ডভিত্তিক রিয়েলটাইম বেড ম্যাপ, অকুপেন্সি স্ট্যাটাস ও বেড ট্রান্সফার</p>
          </div>
          <div class="d-flex gap-2">
            <a href="ipd.html" class="btn btn-hms-primary btn-sm">
              <i class="bi bi-person-plus me-1"></i>নতুন রোগী ভর্তি ও বেড বরাদ্দ
            </a>
          </div>
        </div>

        <!-- Legend Ribbon -->
        <div class="hms-card p-3 mb-4 bg-white d-flex justify-content-between align-items-center flex-wrap gap-3">
          <div class="d-flex align-items-center gap-3">
            <span class="fw-bold text-hms-navy small">স্ট্যাটাস নির্দেশিকা:</span>
            <div class="d-flex align-items-center gap-1 small">
              <span class="badge bg-success rounded-circle p-1"> </span>
              <span>খালি আছে (Available)</span>
            </div>
            <div class="d-flex align-items-center gap-1 small">
              <span class="badge bg-danger rounded-circle p-1"> </span>
              <span>ব্যবহৃত / রোগী ভর্তি (Occupied)</span>
            </div>
            <div class="d-flex align-items-center gap-1 small">
              <span class="badge bg-warning rounded-circle p-1"> </span>
              <span>মেরামত / পরিচ্ছন্নতা (Maintenance)</span>
            </div>
          </div>
          <div>
            <span class="text-muted small">মোট শয্যা: <strong id="total-beds-count" class="text-hms-navy">০</strong> টি</span>
          </div>
        </div>

        <!-- Wards Container -->
        <div id="wards-container">
          <!-- Dynamically populated by JS -->
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/seed-data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      HMS.UI.renderAdminSidebar('beds');
      HMS.UI.renderAdminTopbar('বেড ও ওয়ার্ড', [{ title: 'অপারেশন', url: '#' }, { title: 'বেড ম্যাট্রিক্স', url: '#' }]);
      renderBedMatrix();
    });

    function renderBedMatrix() {
      const wards = HMS.Storage.getCollection('wards');
      const beds = HMS.Storage.getCollection('beds');
      document.getElementById('total-beds-count').textContent = beds.length;

      const container = document.getElementById('wards-container');
      container.innerHTML = wards.map(w => {
        const wardBeds = beds.filter(b => b.ward_id === w.id);
        const occupiedCount = wardBeds.filter(b => b.status === 'Occupied').length;
        const availableCount = wardBeds.filter(b => b.status === 'Available').length;

        return `
          <div class="hms-card p-4 mb-4">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3 flex-wrap gap-2">
              <div>
                <h5 class="fw-bold text-hms-navy mb-0">${w.name} (${w.code})</h5>
                <small class="text-muted">ফ্লোর: ${w.floor} | শয্যা ভাড়া: ${HMS.I18n.formatCurrency(w.charge_per_day)}/দিন</small>
              </div>
              <div>
                <span class="badge bg-success-subtle text-success me-2">খালি: ${availableCount}</span>
                <span class="badge bg-danger-subtle text-danger">ব্যবহৃত: ${occupiedCount}</span>
              </div>
            </div>

            <div class="bed-grid">
              ${wardBeds.map(b => {
                const statusClass = b.status.toLowerCase();
                return `
                  <div class="bed-card ${statusClass}" onclick="handleBedClick('${b.id}')">
                    <div class="bed-icon"><i class="bi bi-hospital"></i></div>
                    <div class="bed-number">বেড ${b.number}</div>
                    <div class="bed-type">${b.type}</div>
                    ${b.patient_name ? `<div class="bed-patient" title="${b.patient_name}">${b.patient_name}</div>` : `<div class="small text-success mt-1">খালি</div>`}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');
    }

    function handleBedClick(bedId) {
      const bed = HMS.Storage.getById('beds', bedId);
      if (!bed) return;
      if (bed.status === 'Occupied') {
        alert(`বেড নং: ${bed.number} (${bed.ward_name})\nবর্তমান রোগী: ${bed.patient_name}\nUHID: ${bed.patient_uhid}\nস্ট্যাটাস: অধিকৃত (Occupied)`);
      } else if (bed.status === 'Available') {
        if (confirm(`বেড নং: ${bed.number} বর্তমানে খালি আছে। আপনি কি এই বেডে রোগী ভর্তি করাতে চান?`)) {
          window.location.href = 'ipd.html';
        }
      } else {
        alert(`বেড নং: ${bed.number} বর্তমানে মেরামত বা পরিচ্ছন্নতায় রয়েছে।`);
      }
    }
  </script>
</body>
</html>
