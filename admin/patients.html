<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>রোগী ব্যবস্থাপনা (Patient Management) | CarePoint HMS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div id="demo-banner-placeholder"></div>

  <div class="dashboard-wrapper">
    <aside class="hms-sidebar" id="admin-sidebar-placeholder"></aside>
    <main class="hms-main-content">
      <header id="admin-topbar-placeholder"></header>

      <div class="dashboard-content">
        <!-- Page Title & Actions -->
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
          <div>
            <h4 class="fw-bold text-hms-navy mb-1">রোগী ব্যবস্থাপনা ডিরেক্টরি (Patient Management)</h4>
            <p class="text-muted small mb-0">অনন্য স্বাস্থ্য পরিচয়পত্র (UHID), বিস্তারিত মেডিকেল হিস্ট্রি ও প্রোফাইল</p>
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary btn-sm" onclick="HMS.UI.exportTableToCSV('patients-table', 'carepoint_patients.csv')">
              <i class="bi bi-download me-1"></i>CSV এক্সপোর্ট
            </button>
            <button class="btn btn-hms-primary btn-sm" onclick="openNewPatientModal()">
              <i class="bi bi-person-plus-fill me-1"></i>নতুন রোগী নিবন্ধন
            </button>
          </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="hms-card p-3 mb-4 bg-white">
          <div class="row g-3">
            <div class="col-md-4">
              <div class="input-group">
                <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
                <input type="text" class="form-control" id="patient-search" placeholder="UHID, নাম বা ফোন নম্বর..." oninput="applyPatientFilters()">
              </div>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="patient-gender-filter" onchange="applyPatientFilters()">
                <option value="">সকল লিঙ্গ (Gender)</option>
                <option value="Male">পুরুষ (Male)</option>
                <option value="Female">নারী (Female)</option>
              </select>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="patient-blood-filter" onchange="applyPatientFilters()">
                <option value="">সকল রক্তের গ্রুপ</option>
                <option value="A+">A+</option>
                <option value="B+">B+</option>
                <option value="O+">O+</option>
                <option value="AB+">AB+</option>
                <option value="O-">O-</option>
              </select>
            </div>
            <div class="col-md-2">
              <select class="form-select" id="patient-status-filter" onchange="applyPatientFilters()">
                <option value="">সকল অবস্থা</option>
                <option value="Active">সক্রিয় (Active)</option>
                <option value="Admitted">ভর্তি (Admitted)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Patient Listing Table -->
        <div class="hms-card">
          <div class="hms-table-responsive">
            <table class="hms-table" id="patients-table">
              <thead>
                <tr>
                  <th>UHID নম্বর</th>
                  <th>রোগীর নাম</th>
                  <th>বয়স ও লিঙ্গ</th>
                  <th>রক্তের গ্রুপ</th>
                  <th>মোবাইল নম্বর</th>
                  <th>অবস্থা</th>
                  <th>নিবন্ধন তারিখ</th>
                  <th class="no-export text-end">অ্যাকশন</th>
                </tr>
              </thead>
              <tbody id="patients-table-body">
                <!-- Rendered by JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- New Patient Registration Modal -->
  <div class="modal fade" id="newPatientModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-hms-navy"><i class="bi bi-person-plus text-primary me-2"></i>নতুন রোগী নিবন্ধন ফরম</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <form onsubmit="saveNewPatient(event)">
          <div class="modal-body p-4">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-semibold">রোগীর নাম (বাংলা) <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="p-name-bn" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">রোগীর নাম (English) <span class="text-danger">*</span></label>
                <input type="text" class="form-control" id="p-name-en" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">মোবাইল নম্বর <span class="text-danger">*</span></label>
                <input type="tel" class="form-control" id="p-phone" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">বয়স (বছর) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="p-age" value="35" required>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">লিঙ্গ <span class="text-danger">*</span></label>
                <select class="form-select" id="p-gender">
                  <option value="Male">পুরুষ (Male)</option>
                  <option value="Female">নারী (Female)</option>
                  <option value="Other">অন্যান্য</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label small fw-semibold">রক্তের গ্রুপ</label>
                <select class="form-select" id="p-blood">
                  <option value="B+">B+</option>
                  <option value="A+">A+</option>
                  <option value="O+">O+</option>
                  <option value="AB+">AB+</option>
                  <option value="O-">O-</option>
                </select>
              </div>
              <div class="col-md-8">
                <label class="form-label small fw-semibold">ঠিকানা</label>
                <input type="text" class="form-control" id="p-address" placeholder="বাসা, রোড, থানা, জেলা">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">জরুরি যোগাযোগের নাম ও সম্পর্ক</label>
                <input type="text" class="form-control" id="p-emerg-name">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">জরুরি ফোন নম্বর</label>
                <input type="tel" class="form-control" id="p-emerg-phone">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">এলার্জি (যদি থাকে)</label>
                <input type="text" class="form-control" id="p-allergies" placeholder="Penicillin, Dust etc.">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-semibold">দীর্ঘমেয়াদী রোগ (Chronic Conditions)</label>
                <input type="text" class="form-control" id="p-chronic" placeholder="Diabetes, Hypertension etc.">
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">বাতিল</button>
            <button type="submit" class="btn btn-hms-primary">নিবন্ধন সংরক্ষণ করুন</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Patient Details & Health Record Modal -->
  <div class="modal fade" id="patientDetailsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-xl">
      <div class="modal-content" id="patient-details-modal-content">
        <!-- Injected by JS -->
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/seed-data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    let patientsList = [];
    let newPatientModalInstance = null;

    document.addEventListener('DOMContentLoaded', () => {
      HMS.UI.renderAdminSidebar('patients');
      HMS.UI.renderAdminTopbar('রোগী ব্যবস্থাপনা', [{ title: 'রোগী সেবা', url: '#' }, { title: 'রোগী ডিরেক্টরি', url: '#' }]);
      loadPatients();

      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('action') === 'new') {
        openNewPatientModal();
      }
    });

    function loadPatients() {
      patientsList = HMS.Storage.getCollection('patients');
      applyPatientFilters();
    }

    function applyPatientFilters() {
      const q = document.getElementById('patient-search').value.toLowerCase().trim();
      const gender = document.getElementById('patient-gender-filter').value;
      const blood = document.getElementById('patient-blood-filter').value;
      const status = document.getElementById('patient-status-filter').value;

      const filtered = patientsList.filter(p => {
        const matchesQuery = !q || p.uhid.toLowerCase().includes(q) || (p.name_bn && p.name_bn.toLowerCase().includes(q)) || (p.name_en && p.name_en.toLowerCase().includes(q)) || p.phone.includes(q);
        const matchesGender = !gender || p.gender === gender;
        const matchesBlood = !blood || p.blood_group === blood;
        const matchesStatus = !status || p.status === status;
        return matchesQuery && matchesGender && matchesBlood && matchesStatus;
      });

      renderPatientTable(filtered);
    }

    function renderPatientTable(list) {
      const tbody = document.getElementById('patients-table-body');
      if (list.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="8" class="text-center py-5 text-muted">
              <i class="bi bi-people fs-2 d-block mb-2 text-secondary"></i>
              কোনো রোগী পাওয়া যায়নি।
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = list.map(p => `
        <tr>
          <td><span class="badge bg-primary text-uppercase">${p.uhid}</span></td>
          <td>
            <div class="fw-bold text-hms-navy">${p.name_bn || p.name_en}</div>
            <small class="text-muted">${p.name_en || ''}</small>
          </td>
          <td>${p.age} বছর / ${p.gender}</td>
          <td><span class="badge bg-danger-subtle text-danger fw-bold">${p.blood_group}</span></td>
          <td>${p.phone}</td>
          <td>
            <span class="hms-badge ${p.status === 'Admitted' ? 'badge-cancelled' : 'badge-active'}">
              <span class="hms-badge-dot"></span>${p.status}
            </span>
          </td>
          <td>${p.registered_date}</td>
          <td class="text-end no-export">
            <div class="btn-group btn-group-sm">
              <button class="btn btn-outline-primary" onclick="viewPatientFull('${p.uhid}')" title="সম্পূর্ণ হিস্ট্রি ও প্রোফাইল">
                <i class="bi bi-eye"></i> বিস্তারিত
              </button>
              <button class="btn btn-outline-success" onclick="printPatientCard('${p.uhid}')" title="UHID কার্ড প্রিন্ট">
                <i class="bi bi-printer"></i>
              </button>
              <button class="btn btn-outline-danger" onclick="deletePatientRecord('${p.id}')" title="মুছে ফেলুন">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    function openNewPatientModal() {
      newPatientModalInstance = new bootstrap.Modal(document.getElementById('newPatientModal'));
      newPatientModalInstance.show();
    }

    function saveNewPatient(e) {
      e.preventDefault();
      const pData = {
        name_bn: document.getElementById('p-name-bn').value,
        name_en: document.getElementById('p-name-en').value,
        phone: document.getElementById('p-phone').value,
        age: Number(document.getElementById('p-age').value),
        gender: document.getElementById('p-gender').value,
        blood_group: document.getElementById('p-blood').value,
        address: document.getElementById('p-address').value,
        emergency_contact_name: document.getElementById('p-emerg-name').value,
        emergency_contact_phone: document.getElementById('p-emerg-phone').value,
        allergies: document.getElementById('p-allergies').value || 'None',
        chronic_conditions: document.getElementById('p-chronic').value || 'None'
      };

      const created = HMS.Storage.registerPatient(pData);
      newPatientModalInstance.hide();
      HMS.UI.showToast(`রোগী সফলভাবে নিবন্ধিত! তৈরি হওয়া UHID: ${created.uhid}`, 'success');
      loadPatients();
      e.target.reset();
    }

    function deletePatientRecord(id) {
      if (confirm('আপনি কি এই রোগীর রেকর্ডটি মুছে ফেলতে নিশ্চিত?')) {
        HMS.Storage.delete('patients', id);
        HMS.UI.showToast('রোগীর রেকর্ড সফলভাবে মুছে ফেলা হয়েছে!', 'success');
        loadPatients();
      }
    }

    function viewPatientFull(uhid) {
      const p = HMS.Storage.getById('patients', uhid);
      if (!p) return;
      const apts = HMS.Storage.getCollection('appointments').filter(a => a.patient_uhid === uhid);
      const invoices = HMS.Storage.getCollection('invoices').filter(i => i.uhid === uhid);
      const labOrders = HMS.Storage.getCollection('lab_orders').filter(l => l.uhid === uhid);
      const admissions = HMS.Storage.getCollection('admissions').filter(a => a.uhid === uhid);

      const modalEl = document.getElementById('patient-details-modal-content');
      modalEl.innerHTML = `
        <div class="modal-header">
          <div class="d-flex align-items-center gap-2">
            <h5 class="modal-title fw-bold text-hms-navy">${p.name_bn || p.name_en}</h5>
            <span class="badge bg-primary text-uppercase">${p.uhid}</span>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <!-- Navigation Tabs -->
          <ul class="nav nav-pills mb-4" id="p-tabs" role="tablist">
            <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-profile">ব্যক্তিগত প্রোফাইল</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-med">মেডিকেল হিস্ট্রি ও এলার্জি</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-apts">অ্যাপয়েন্টমেন্ট (${apts.length})</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-labs">ল্যাব ও ডায়াগনস্টিক (${labOrders.length})</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-adms">ভর্তি ও শয্যা ইতিহাস (${admissions.length})</button></li>
            <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-bills">বিল ও পেমেন্ট (${invoices.length})</button></li>
          </ul>

          <div class="tab-content">
            <!-- Profile Tab -->
            <div class="tab-pane fade show active" id="tab-profile">
              <div class="row g-3">
                <div class="col-md-4">
                  <div class="p-3 bg-light rounded text-center">
                    <i class="bi bi-person-circle fs-1 text-primary"></i>
                    <h5 class="mt-2 mb-0 fw-bold">${p.name_bn}</h5>
                    <small class="text-muted">${p.name_en}</small>
                    <div class="mt-2"><span class="badge bg-success">${p.status}</span></div>
                  </div>
                </div>
                <div class="col-md-8">
                  <div class="row g-2">
                    <div class="col-6"><strong>মোবাইল:</strong> ${p.phone}</div>
                    <div class="col-6"><strong>বয়স ও লিঙ্গ:</strong> ${p.age} বছর / ${p.gender}</div>
                    <div class="col-6"><strong>রক্তের গ্রুপ:</strong> <span class="badge bg-danger">${p.blood_group}</span></div>
                    <div class="col-6"><strong>নিবন্ধনের তারিখ:</strong> ${p.registered_date}</div>
                    <div class="col-12"><strong>ঠিকানা:</strong> ${p.address || 'তথ্য নেই'}</div>
                    <div class="col-12"><strong>জরুরি যোগাযোগ:</strong> ${p.emergency_contact_name || 'N/A'} (${p.emergency_contact_phone || 'N/A'})</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Medical History Tab -->
            <div class="tab-pane fade" id="tab-med">
              <div class="alert alert-warning">
                <strong><i class="bi bi-exclamation-triangle-fill me-1"></i>ড্রাগ ও খাদ্য এলার্জি:</strong> ${p.allergies}
              </div>
              <div class="p-3 border rounded mb-3">
                <h6 class="fw-bold text-hms-navy">ক্রনিক অসুখ ও ডায়াগনোসিস:</h6>
                <p class="mb-0 text-muted">${p.chronic_conditions}</p>
              </div>
            </div>

            <!-- Appointments Tab -->
            <div class="tab-pane fade" id="tab-apts">
              ${apts.length === 0 ? '<p class="text-muted text-center py-3">কোনো অ্যাপয়েন্টমেন্ট রেকর্ড নেই।</p>' : `
                <table class="table table-bordered table-sm small">
                  <thead><tr><th>টোকেন</th><th>চিকিৎসক</th><th>বিভাগ</th><th>তারিখ ও সময়</th><th>অবস্থা</th></tr></thead>
                  <tbody>${apts.map(a => `<tr><td>#${a.token_no}</td><td>${a.doctor_name}</td><td>${a.dept_name}</td><td>${a.date} ${a.time_slot}</td><td><span class="badge bg-info">${a.status}</span></td></tr>`).join('')}</tbody>
                </table>
              `}
            </div>

            <!-- Labs Tab -->
            <div class="tab-pane fade" id="tab-labs">
              ${labOrders.length === 0 ? '<p class="text-muted text-center py-3">কোনো ল্যাব অর্ডার পাওয়া যায়নি।</p>' : `
                <table class="table table-bordered table-sm small">
                  <thead><tr><th>অর্ডার নং</th><th>টেস্টসমূহ</th><th>তারিখ</th><th>অবস্থা</th></tr></thead>
                  <tbody>${labOrders.map(l => `<tr><td>${l.order_no}</td><td>${l.tests.join(', ')}</td><td>${l.order_date}</td><td><span class="badge bg-success">${l.status}</span></td></tr>`).join('')}</tbody>
                </table>
              `}
            </div>

            <!-- Admissions Tab -->
            <div class="tab-pane fade" id="tab-adms">
              ${admissions.length === 0 ? '<p class="text-muted text-center py-3">রোগী কখনো হাসপাতালে ভর্তি হননি।</p>' : `
                <table class="table table-bordered table-sm small">
                  <thead><tr><th>ভর্তি নং</th><th>বেড / ওয়ার্ড</th><th>তারিখ</th><th>ডাক্তার</th><th>অবস্থা</th></tr></thead>
                  <tbody>${admissions.map(adm => `<tr><td>${adm.admission_no}</td><td>${adm.bed_number} (${adm.ward_name})</td><td>${adm.admission_date}</td><td>${adm.attending_doctor}</td><td><span class="badge bg-primary">${adm.status}</span></td></tr>`).join('')}</tbody>
                </table>
              `}
            </div>

            <!-- Invoices Tab -->
            <div class="tab-pane fade" id="tab-bills">
              ${invoices.length === 0 ? '<p class="text-muted text-center py-3">কোনো ইনভয়েস পাওয়া যায়নি।</p>' : `
                <table class="table table-bordered table-sm small">
                  <thead><tr><th>ইনভয়েস নং</th><th>তারিখ</th><th>মোট টাকা</th><th>পরিশোধ</th><th>বকেয়া</th><th>অবস্থা</th></tr></thead>
                  <tbody>${invoices.map(inv => `<tr><td>${inv.invoice_no}</td><td>${inv.date}</td><td>${HMS.I18n.formatCurrency(inv.total)}</td><td>${HMS.I18n.formatCurrency(inv.paid_amount)}</td><td>${HMS.I18n.formatCurrency(inv.due_amount)}</td><td><span class="badge ${inv.status === 'Paid' ? 'bg-success' : 'bg-warning'}">${inv.status}</span></td></tr>`).join('')}</tbody>
                </table>
              `}
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" onclick="printPatientCard('${p.uhid}')"><i class="bi bi-printer me-1"></i>কার্ড প্রিন্ট</button>
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">বন্ধ করুন</button>
        </div>
      `;
      const modal = new bootstrap.Modal(document.getElementById('patientDetailsModal'));
      modal.show();
    }

    function printPatientCard(uhid) {
      const p = HMS.Storage.getById('patients', uhid);
      if (!p) return;
      const win = window.open('', '_blank');
      win.document.write(`
        <html>
        <head>
          <title>Health Card - ${p.uhid}</title>
          <style>
            body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
            .card { width: 380px; border: 2px solid #1677C8; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
            .header { text-align: center; border-bottom: 2px solid #1677C8; padding-bottom: 10px; margin-bottom: 15px; }
            .header h3 { margin: 0; color: #12304A; font-size: 18px; }
            .header small { color: #1677C8; font-weight: bold; }
            .field { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
            .qr-box { text-align: center; margin-top: 15px; padding-top: 10px; border-top: 1px dashed #ccc; }
          </style>
        </head>
        <body onload="window.print()">
          <div class="card">
            <div class="header">
              <h3>CarePoint Hospital</h3>
              <small>PATIENT SMART HEALTH CARD</small>
            </div>
            <div class="field"><span>UHID:</span><strong>${p.uhid}</strong></div>
            <div class="field"><span>Name:</span><strong>${p.name_bn || p.name_en}</strong></div>
            <div class="field"><span>Age/Gender:</span><span>${p.age} Y / ${p.gender}</span></div>
            <div class="field"><span>Blood Group:</span><strong style="color:red">${p.blood_group}</strong></div>
            <div class="field"><span>Phone:</span><span>${p.phone}</span></div>
            <div class="qr-box">
              <div style="display:inline-block; border:1px solid #000; padding:10px; font-family:monospace;">[QR CODE: ${p.uhid}]</div>
              <div style="font-size:10px; margin-top:5px; color:#666;">24/7 Helpline: 10678 | Dhanmondi, Dhaka</div>
            </div>
          </div>
        </body>
        </html>
      `);
      win.document.close();
    }
  </script>
</body>
</html>
