<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>আমার প্রেসক্রিপশনসমূহ | CarePoint Patient Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>
  <div id="demo-banner-placeholder"></div>

  <div class="dashboard-wrapper">
    <aside class="hms-sidebar patient-sidebar" id="patient-sidebar-placeholder"></aside>
    <main class="hms-main-content">
      <header id="patient-topbar-placeholder"></header>

      <div class="dashboard-content">
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
          <div>
            <h4 class="fw-bold text-hms-navy mb-1"><i class="bi bi-file-earmark-medical-fill text-success me-2"></i>আমার প্রেসক্রিপশনসমূহ (My Prescriptions)</h4>
            <p class="text-muted small mb-0">কনসালট্যান্ট চিকিৎসকদের ডিজিটাল প্রেসক্রিপশন, ঔষধের ডোজ ও ফলোআপ হিস্ট্রি</p>
          </div>
        </div>

        <div class="row g-4" id="prescriptions-container">
          <!-- Populated by JS -->
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/seed-data.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      HMS.UI.renderPatientSidebar('prescriptions');
      HMS.UI.renderPatientTopbar('আমার প্রেসক্রিপশন');
      loadPrescriptions();
    });

    function loadPrescriptions() {
      const rxList = HMS.SEED_DATA.opd_visits; // Default seeded OPD prescription for CPH-2026-0001
      const container = document.getElementById('prescriptions-container');

      container.innerHTML = rxList.map(rx => `
        <div class="col-12">
          <div class="prescription-paper shadow-sm">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
              <div>
                <h5 class="fw-bold text-hms-navy mb-0">কেয়ারপয়েন্ট মাল্টিস্পেশালিটি হাসপাতাল</h5>
                <small class="text-muted">ডিজিটাল বহির্বিভাগ প্রেসক্রিপশন | তারিখ: ${rx.date}</small>
              </div>
              <div class="text-end">
                <strong class="text-primary">${rx.doctor_name}</strong>
                <small class="d-block text-muted">কার্ডিওলজি বিভাগ</small>
              </div>
            </div>

            <div class="p-3 bg-light rounded-3 mb-3 small d-flex justify-content-between flex-wrap gap-2">
              <div><strong>রোগী:</strong> ${rx.patient_name} (${rx.uhid})</div>
              <div><strong>Vitals:</strong> BP: ${rx.vitals.bp} | Pulse: ${rx.vitals.pulse} | SpO2: ${rx.vitals.spo2}</div>
            </div>

            <div class="mb-3">
              <strong>রোগ নির্ণয় (Diagnosis):</strong> <span class="text-danger fw-semibold">${rx.diagnosis}</span>
            </div>

            <div class="mb-3">
              <span class="rx-symbol">℞</span>
              <div class="table-responsive mt-2">
                <table class="table table-bordered table-sm small">
                  <thead class="table-light"><tr><th>ঔষধের নাম</th><th>ডোজ ও সেবনবিধি</th><th>মেয়াদ</th></tr></thead>
                  <tbody>
                    ${rx.medicines.map(m => `<tr><td class="fw-bold text-hms-navy">${m.name}</td><td>${m.dosage}</td><td>${m.duration}</td></tr>`).join('')}
                  </tbody>
                </table>
              </div>
            </div>

            <div class="mb-3 small">
              <strong>পরামর্শ ও ফলোআপ:</strong>
              <p class="text-muted mb-0">${rx.advice}</p>
              <div class="mt-1 text-primary fw-semibold">ফলোআপ: ${rx.follow_up}</div>
            </div>

            <div class="text-end pt-3 border-top no-print">
              <button class="btn btn-outline-primary btn-sm" onclick="window.print()">
                <i class="bi bi-printer me-1"></i>প্রেসক্রিপশন প্রিন্ট
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }
  </script>
</body>
</html>
