<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>বিশেষজ্ঞ চিকিৎসকবৃন্দ (Doctors) | কেয়ারপয়েন্ট হাসপাতাল</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/website.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div id="demo-banner-placeholder"></div>
  <div id="public-topbar-placeholder"></div>
  <div id="public-navbar-placeholder"></div>

  <div class="bg-hms-navy text-white py-5">
    <div class="container text-center">
      <h1 class="fw-bold mb-2">আমাদের বিশেষজ্ঞ চিকিৎসকবৃন্দ</h1>
      <p class="text-light opacity-75 mb-0">দেশ-বিদেশের স্বনামধন্য ও উচ্চতর ডিগ্রিপ্রাপ্ত পরামর্শক দল</p>
    </div>
  </div>

  <div class="container py-5">
    <!-- Filters Row -->
    <div class="row g-3 mb-4 align-items-center bg-white p-3 rounded-3 shadow-sm border">
      <div class="col-md-5">
        <label class="form-label small fw-semibold text-muted mb-1">ডাক্তারের নাম বা পদবী দিয়ে খুঁজুন</label>
        <div class="input-group">
          <span class="input-group-text bg-white"><i class="bi bi-search text-muted"></i></span>
          <input type="text" class="form-control" id="doc-search" placeholder="ডাক্তারের নাম লিখুন..." oninput="applyDoctorFilters()">
        </div>
      </div>
      <div class="col-md-4">
        <label class="form-label small fw-semibold text-muted mb-1">বিভাগ অনুযায়ী ফিল্টার</label>
        <select class="form-select" id="doc-dept-filter" onchange="applyDoctorFilters()">
          <option value="">সকল বিভাগ (All Departments)</option>
        </select>
      </div>
      <div class="col-md-3">
        <label class="form-label small fw-semibold text-muted mb-1">উপলব্ধতা (Availability)</label>
        <select class="form-select" id="doc-avail-filter" onchange="applyDoctorFilters()">
          <option value="">সকল অবস্থা</option>
          <option value="Available">উপলব্ধ (Available)</option>
          <option value="On Leave">ছুটিতে আছেন (On Leave)</option>
        </select>
      </div>
    </div>

    <!-- Doctor Grid -->
    <div class="row g-4" id="doctors-container">
      <!-- Injected by JS -->
    </div>
  </div>

  <!-- Doctor Profile Modal -->
  <div class="modal fade" id="doctorProfileModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered modal-lg">
      <div class="modal-content" id="doctor-modal-content">
        <!-- Rendered by JS -->
      </div>
    </div>
  </div>

  <div id="public-footer-placeholder"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/seed-data.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/website.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    let allDoctors = [];

    document.addEventListener('DOMContentLoaded', () => {
      HMS.Website.initNavbarAndFooter('doctors');
      initDoctorFilters();
    });

    function initDoctorFilters() {
      allDoctors = HMS.Storage.getCollection('doctors');
      const depts = HMS.Storage.getCollection('departments');
      const deptFilter = document.getElementById('doc-dept-filter');

      deptFilter.innerHTML = '<option value="">সকল বিভাগ (All Departments)</option>' + 
        depts.map(d => `<option value="${d.id}">${d.name_bn}</option>`).join('');

      // Check URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const urlDept = urlParams.get('dept');
      if (urlDept) {
        deptFilter.value = urlDept;
      }
      applyDoctorFilters();
    }

    function applyDoctorFilters() {
      const q = document.getElementById('doc-search').value.toLowerCase().trim();
      const dept = document.getElementById('doc-dept-filter').value;
      const avail = document.getElementById('doc-avail-filter').value;

      const filtered = allDoctors.filter(d => {
        const matchesQuery = !q || d.name_bn.toLowerCase().includes(q) || d.name_en.toLowerCase().includes(q) || d.degrees.toLowerCase().includes(q) || d.designation.toLowerCase().includes(q);
        const matchesDept = !dept || d.dept_id === dept;
        const matchesAvail = !avail || d.status === avail;
        return matchesQuery && matchesDept && matchesAvail;
      });

      renderDoctors(filtered);
    }

    function renderDoctors(list) {
      const container = document.getElementById('doctors-container');
      if (list.length === 0) {
        container.innerHTML = `
          <div class="col-12">
            <div class="hms-empty-state">
              <i class="bi bi-person-x hms-empty-state-icon"></i>
              <h5 class="hms-empty-state-title">কোনো চিকিৎসক খুঁজে পাওয়া যায়নি</h5>
              <p class="hms-empty-state-desc">অন্য কোনো ফিল্টার নির্বাচন করে পুনরায় অনুসন্ধান করুন।</p>
            </div>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map(doc => `
        <div class="col-xl-3 col-lg-4 col-md-6">
          <div class="doctor-card">
            <div class="doctor-image-wrapper">
              <i class="bi bi-person-fill doctor-placeholder-avatar"></i>
              <span class="doctor-dept-badge">${doc.dept_name}</span>
            </div>
            <div class="doctor-info">
              <h5 class="doctor-name">${doc.name_bn}</h5>
              <div class="doctor-degrees">${doc.degrees}</div>
              <div class="small text-muted mb-2">${doc.designation}</div>
              <div class="doctor-details-list">
                <div><i class="bi bi-clock me-1 text-primary"></i>${doc.schedule}</div>
                <div><i class="bi bi-geo-alt me-1 text-muted"></i>রুম নং: <strong>${doc.room}</strong></div>
              </div>
              <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                <div>
                  <small class="text-muted d-block">পরামর্শ ফি</small>
                  <span class="doctor-fee">${HMS.I18n.formatCurrency(doc.fee)}</span>
                </div>
                <div class="d-flex gap-1">
                  <button class="btn btn-sm btn-outline-secondary" onclick="viewDoctorDetails('${doc.id}')">প্রোফাইল</button>
                  <a href="appointment.html?doc=${doc.id}" class="btn btn-sm btn-hms-primary">সিরিয়াল নিন</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function viewDoctorDetails(docId) {
      const doc = HMS.Storage.getById('doctors', docId);
      if (!doc) return;
      const modalEl = document.getElementById('doctor-modal-content');
      modalEl.innerHTML = `
        <div class="modal-header">
          <h5 class="modal-title fw-bold text-hms-navy">${doc.name_bn}</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body p-4">
          <div class="row g-4">
            <div class="col-md-4 text-center">
              <div class="p-4 bg-light rounded-3 mb-2">
                <i class="bi bi-person-circle fs-1 text-primary"></i>
              </div>
              <span class="badge ${doc.status === 'Available' ? 'bg-success' : 'bg-warning'}">${doc.status}</span>
              <div class="mt-2 text-warning">
                <i class="bi bi-star-fill"></i> ${doc.rating} / 5.0
              </div>
            </div>
            <div class="col-md-8">
              <h5 class="fw-bold text-hms-navy">${doc.name_bn}</h5>
              <div class="text-muted small">${doc.name_en}</div>
              <div class="text-primary fw-semibold my-2">${doc.degrees}</div>
              <div class="text-secondary small mb-3">${doc.designation}</div>
              <p class="small text-muted mb-3">${doc.bio}</p>
              <div class="p-3 bg-light rounded-3 mb-3 small">
                <div><strong>বিভাগ:</strong> ${doc.dept_name}</div>
                <div><strong>চেম্বার সময়:</strong> ${doc.schedule}</div>
                <div><strong>রুম নং:</strong> ${doc.room}</div>
                <div><strong>অভিজ্ঞতা:</strong> ${doc.experience}</div>
                <div><strong>পরামর্শ ফি:</strong> ${HMS.I18n.formatCurrency(doc.fee)}</div>
              </div>
              <a href="appointment.html?doc=${doc.id}" class="btn btn-hms-primary w-100">
                এই ডাক্তারের সাথে অ্যাপয়েন্টমেন্ট নিন
              </a>
            </div>
          </div>
        </div>
      `;
      const modal = new bootstrap.Modal(document.getElementById('doctorProfileModal'));
      modal.show();
    }
  </script>
</body>
</html>
